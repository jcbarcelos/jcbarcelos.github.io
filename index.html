    function render(lang) {
      const data = t[lang];
      if (!data) return;
      let html = '<h1>' + data.title + '</h1>';
      html += '<p><strong>' + data.subtitle + '</strong></p>';
      html += '<p class="date">' + data.date + '</p>';
      for (const s of data.sections) {
        html += '<h2>' + s.h + '</h2>';
        for (const p of (s.p || [])) html += '<p>' + p + '</p>';
        if (s.ul) { html += '<ul>'; for (const li of s.ul) html += '<li>' + li + '</li>'; html += '</ul>'; }
        if (s.p2) html += '<p>' + s.p2 + '</p>';
      }
      document.getElementById('content').innerHTML = html;
      document.title = data.title + ' — Quebra-Cabeça';
      document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
    }

    const sel = document.getElementById('langSelect');
    const saved = localStorage.getItem('privacy_lang');
    if (saved && langs.includes(saved)) sel.value = saved;
    render(sel.value);
    sel.addEventListener('change', function() {
      localStorage.setItem('privacy_lang', this.value);
      render(this.value);
    });
  </script>
