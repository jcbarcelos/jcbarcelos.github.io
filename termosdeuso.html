    function render(lang) {
      const data = t[lang];
      if (!data) return;
      let html = '<h1>' + data.title + '</h1>';
      html += '<p><strong>' + data.subtitle + '</strong></p>';
      html += '<p class="date">' + data.date + '</p>';
      html += '<p>' + data.intro + '</p>';
      for (const s of data.sections) {
        html += '<h2>' + s.h + '</h2>';
        if (s.p) html += '<p>' + s.p + '</p>';
        if (s.ul) {
          html += '<ul>';
          for (const li of s.ul) html += '<li>' + li + '</li>';
          html += '</ul>';
        }
      }
      document.getElementById('content').innerHTML = html;
      document.title = data.title + ' — Quebra-Cabeça';
      document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
    }

    const sel = document.getElementById('langSelect');
    const saved = localStorage.getItem('terms_lang');
    if (saved && langs.includes(saved)) sel.value = saved;
    render(sel.value);
    sel.addEventListener('change', function() {
      localStorage.setItem('terms_lang', this.value);
      render(this.value);
    });
